name: Extract Assets.car
on: [workflow_dispatch]

jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if file exists
        run: |
          if [ ! -f "Assets.car" ]; then
            echo "خطأ: لم يتم العثور على ملف Assets.car في جذر المستودع!"
            exit 1
          fi

      - name: Install Extraction Tool
        run: |
          # تحميل أداة مخصصة لاستخراج الصور الفعلية وتنصيبها في السيرفر
          git clone https://github.com
          cd carutil
          cargo build --release
          echo "$(pwd)/target/release" >> $GITHUB_PATH

      - name: Extract Images
        run: |
          mkdir -p extracted_images
          # تشغيل الأداة لاستخراج الصور إلى المجلد المخصص
          carutil extract Assets.car --output-path ./extracted_images

      - name: Zip Extracted Files
        run: |
          zip -r images.zip extracted_images/

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: my-extracted-images
          path: images.zip
