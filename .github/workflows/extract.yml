name: extract-car
on: workflow_dispatch
jobs:
  extract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install acextract
        run: |
          brew tap canhth/acextract
          brew install acextract
      - name: Extract images
        run: |
          mkdir output
          acextract -i Assets.car -o output
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: extracted-images
          path: output
