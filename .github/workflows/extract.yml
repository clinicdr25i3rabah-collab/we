name: extract-car
on: workflow_dispatch
jobs:
  extract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build acextract
        run: |
          git clone --recursive https://github.com/bartoszj/acextract.git
          cd acextract
          xcodebuild -project acextract.xcodeproj -scheme acextract -configuration Release CONFIGURATION_BUILD_DIR=build
      - name: Extract images
        run: |
          mkdir output
          ./acextract/build/acextract -i Assets.car -o output
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: extracted-images
          path: output
